name: Push image to Scaleway Container Registry
description: Build the Docker image and push it to Scaleway Container Registry, tagged with the commit SHA and `latest`.

inputs:
  region:
    description: Scaleway region of the registry (e.g. fr-par).
    required: true
  namespace:
    description: Container Registry namespace name.
    required: true
  image-name:
    description: Image name inside the namespace.
    required: false
    default: app
  secret-key:
    description: Scaleway secret key, used as the registry password.
    required: true
  context:
    description: Docker build context.
    required: false
    default: .
  platforms:
    description: Target platforms.
    required: false
    default: linux/amd64

outputs:
  image:
    description: Image reference without a tag.
    value: ${{ steps.ref.outputs.image }}
  digest:
    description: Digest of the pushed image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Resolve image reference
      id: ref
      shell: bash
      env:
        REGION: ${{ inputs.region }}
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: echo "image=rg.${REGION}.scw.cloud/${NAMESPACE}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Scaleway Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: rg.${{ inputs.region }}.scw.cloud
        username: nologin
        password: ${{ inputs.secret-key }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ${{ steps.ref.outputs.image }}:${{ github.sha }}
          ${{ steps.ref.outputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
